# lanes CI — the plugin's own gate.
#
# Two jobs, both on every push and pull request:
#   tests     the pytest suite (stdlib + pytest; builds throwaway repos)
#   validate  `claude plugin validate --strict` on the two manifests and the
#             two component directories, so a warning the runtime tolerates
#             (an unrecognized field, missing metadata) fails here instead.
#
# `validate` runs on the root AND on each manifest: on the author's machine a
# run on `.` checked only the marketplace manifest, on this runner it descends
# into the components -- same CLI version. Naming all three is what holds.
name: ci

on:
  push:
    branches: [main]      # not tags: a release tag points at a commit main already ran
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # tests/test_skills.py::test_plugin_validates_strict shells out to the CLI
      # and skips without it; CI installs it so the suite here is the suite at home.
      - run: npm install -g @anthropic-ai/claude-code
      - run: python -m pip install --quiet pytest
      - run: python -m pytest -q tests/

  validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @anthropic-ai/claude-code
      # Three targets, not one: which of them descends into skills/ and
      # commands/ has differed between the author's machine and this runner on
      # the SAME CLI version, and a bare `skills` directory is read here as a
      # plugin root ("No manifest found"). The root run and the plugin
      # manifest run each cover the components on at least one of them.
      - name: plugin root
        run: claude plugin validate --strict .
      - name: plugin manifest
        run: claude plugin validate --strict .claude-plugin/plugin.json
      - name: marketplace manifest
        run: claude plugin validate --strict .claude-plugin/marketplace.json
